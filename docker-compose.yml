version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tasks_db}
      POSTGRES_USER: ${POSTGRES_USER:-tasks_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tasks_user} -d ${POSTGRES_DB:-tasks_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-tasks_db}
      POSTGRES_USER: ${POSTGRES_USER:-tasks_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tasks_password}
      APP_PORT: ${APP_PORT:-8000}
    ports:
      - "${APP_PORT:-8000}:8000"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload


